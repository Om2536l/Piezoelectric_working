<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Working of Piezoelectric Sensor</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#fff;overflow:hidden;font-family:"Segoe UI",Arial,Helvetica,sans-serif;font-weight:800;color:#12263F}
#s{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#fff}
#t{position:absolute;left:80px;top:32px;font-size:44px;letter-spacing:1px;white-space:nowrap}#t span{color:#E0662B}
svg{position:absolute;left:0;top:0;pointer-events:none}
.bt{position:absolute;z-index:5;top:30px;height:54px;padding:0 20px;font:800 24px "Segoe UI",Arial;border:0;border-radius:14px;background:#12263F;color:#fff;cursor:pointer}
</style></head><body><div id="s">
<div id="t">WORKING OF <span>PIEZOELECTRIC SENSOR</span></div>
<button class="bt" id="bp" style="left:1340px">PAUSE</button>
<button class="bt" id="br" style="left:1490px;background:#E0662B">RESTART</button>
<button class="bt" id="bs" style="left:1670px;background:#1F6FD1">SLOW ×0.5</button>
<svg id="g" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
</div>
<script>
const $=i=>document.getElementById(i),O='#E0662B',B='#1F6FD1',N='#12263F',G='#6B778A';
const T=18,tp=2.5,tr=11,tau=3,dt=.02,AV=11.5;
const FS=[],VS=[];let v=0,pf=0;
for(let i=0;i<=T/dt;i++){const t=i*dt,F=Math.min(1,Math.max(0,(t-tp)/.15))-Math.min(1,Math.max(0,(t-tr)/.15));v=v*Math.exp(-dt/tau)+(F-pf);pf=F;FS.push(F);VS.push(v)}
const mx=Math.max(...VS.map(Math.abs));VS.forEach((a,i)=>VS[i]=a/mx);
const X=t=>280+83.3*t,yF=F=>560-90*F,yV=a=>805-170*a;
const L=[['FORCE','APPLIED'],['CRYSTAL','SQUEEZED'],['CHARGE','APPEARS'],['ELECTRODES','COLLECT Q'],['CHARGE','AMPLIFIER'],['VOLTAGE','OUTPUT']];
let t=0,pl=1,sp=1,hold=0,last=performance.now();
const sg=x=>(x>=0?'+':'−')+Math.abs(x).toFixed(x==0||Math.abs(x)>=100?0:1);
function draw(){
 const ci=Math.min(FS.length-1,Math.floor(t/dt));let ev=-1,rel=0;
 if(t>=tr){ev=t-tr;rel=1}else if(t>=tp)ev=t-tp;
 const idx=ev>=0&&ev<3.6?Math.min(5,Math.floor(ev/.6)):-1,lit=i=>ev<0?false:ev<3.6?i<=idx:(!rel&&i<=1);
 let s='<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#12263F" flood-opacity=".22"/></filter></defs>';
 for(let i=0;i<6;i++){const x=80+i*302,on=lit(i),c=i<4?O:B;
  s+=`<rect x="${x}" y="110" width="250" height="150" rx="22" filter="url(#sh)" fill="${on?c:'#F4F7FB'}" stroke="${on?c:'#C9D2DE'}" stroke-width="5"/><text x="${x+125}" y="182" font-size="26" fill="${on?'#fff':N}" text-anchor="middle">${L[i][0]}</text><text x="${x+125}" y="228" font-size="26" fill="${on?'#fff':N}" text-anchor="middle">${L[i][1]}</text><circle cx="${x+30}" cy="110" r="25" fill="#fff" stroke="${N}" stroke-width="5"/><text x="${x+30}" y="120" font-size="26" fill="${N}" text-anchor="middle">${i+1}</text>`;
  if(i<5)s+=`<path d="M${x+258} 167L${x+296} 185L${x+258} 203Z" fill="${lit(i+1)?(i<3?O:B):'#9AA6B6'}"/>`}
 if(ev>=0&&ev<3.6){const p=Math.min(1,ev/3),px=205+p*1510;s+=`<circle cx="${px}" cy="185" r="20" fill="${px>1415?B:O}" stroke="#fff" stroke-width="5"/>`}
 const vv=VS[ci]*AV;
 s+=`<text x="205" y="305" font-size="27" fill="${O}" text-anchor="middle">F = ${(500*FS[ci]).toFixed(0)} N</text><text x="809" y="305" font-size="27" fill="${O}" text-anchor="middle">Q = ${sg(vv*100)} pC</text><text x="1715" y="305" font-size="27" fill="${B}" text-anchor="middle">V = ${sg(vv)} V</text>`;
 let m,c;
 if(t<tp){m='WAITING: no force → output is ZERO';c=G}else if(t<tp+3.6){m='PRESS: force applied → +VOLTAGE SPIKE';c=O}else if(t<tr){m='HOLD: charge leaks → voltage falls to ZERO';c=N}else if(t<tr+3.6){m='RELEASE: force removed → −VOLTAGE SPIKE';c=B}else{m='BACK TO ZERO: piezo senses CHANGE, not steady force';c=N}
 s+=`<text x="80" y="378" font-size="40" fill="${c}">${m}</text>`;
 s+=`<rect x="250" y="420" width="1560" height="160" rx="16" fill="#F4F7FB"/><rect x="250" y="600" width="1560" height="410" rx="16" fill="#F4F7FB"/>`
  +`<path d="M265 560H1795M265 805H1795" stroke="#9AA6B6" stroke-width="3" stroke-dasharray="10 8"/>`
  +[tp,tr].map((a,i)=>`<path d="M${X(a)} 425V1005" stroke="#C9D2DE" stroke-width="4" stroke-dasharray="4 8"/><text x="${X(a)+8}" y="450" font-size="21" fill="${G}">${i?'RELEASE':'PRESS'}</text>`).join('')
  +`<text x="80" y="505" font-size="30" fill="${O}">FORCE</text><text x="80" y="790" font-size="28" fill="${B}">OUTPUT</text><text x="80" y="835" font-size="28" fill="${B}">VOLTAGE</text><text x="268" y="660" font-size="32" fill="${G}">+</text><text x="270" y="965" font-size="32" fill="${G}">−</text><text x="1790" y="1045" font-size="24" fill="${G}" text-anchor="end">TIME →</text>`;
 let pF='',pV='';for(let i=0;i<=ci;i++){pF+=`${X(i*dt)},${yF(FS[i])} `;pV+=`${X(i*dt)},${yV(VS[i])} `}
 s+=`<polyline points="${pF}" fill="none" stroke="${O}" stroke-width="10" stroke-linejoin="round"/><polyline points="${pV}" fill="none" stroke="${B}" stroke-width="10" stroke-linejoin="round"/>`
  +`<path d="M${X(t)} 425V1005" stroke="${N}" stroke-width="3" stroke-dasharray="8 8"/><circle cx="${X(ci*dt)}" cy="${yF(FS[ci])}" r="14" fill="${O}"/><circle cx="${X(ci*dt)}" cy="${yV(VS[ci])}" r="14" fill="${B}"/>`;
 if(t>5&&t<tr+1)s+=`<text x="${X(5)}" y="660" font-size="26" fill="${N}">CHARGE LEAKS AWAY (τ = R × C)</text>`;
 $('g').innerHTML=s}
function loop(n){const d=Math.min(.05,(n-last)/1000);last=n;if(pl){t+=d*sp;if(t>=T){hold+=d;t=T-1e-6;if(hold>2.5){t=0;hold=0}}}draw();requestAnimationFrame(loop)}
const tgl=()=>{pl^=1;$('bp').textContent=pl?'PAUSE':'PLAY ▶'},rst=()=>{t=0;hold=0},slw=()=>{sp=sp==1?.5:1;$('bs').textContent=sp==1?'SLOW ×0.5':'SPEED ×1'};
$('bp').onclick=tgl;$('br').onclick=rst;$('bs').onclick=slw;
onkeydown=e=>{if(e.key==' ')tgl();else if(e.key=='r'||e.key=='R')rst();else if(e.key=='s'||e.key=='S')slw();else if(e.key=='ArrowRight')t=Math.min(T-.01,t+.5);else if(e.key=='ArrowLeft')t=Math.max(0,t-.5);else if(e.key=='f'||e.key=='F')document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()};
function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080),s=$('s').style;s.transform=`scale(${k})`;s.left=(innerWidth-1920*k)/2+'px';s.top=(innerHeight-1080*k)/2+'px'}
onresize=fit;fit();requestAnimationFrame(loop);
</script></body></html>
